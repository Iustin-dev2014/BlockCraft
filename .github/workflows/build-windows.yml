name: Build BlockCraft Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and test Android app
        run: gradle --no-daemon clean test :androidApp:assembleDebug

      - name: Verify APK and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload Android APK only
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-Android-APK
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-android-build-reports
          path: |
            build/reports/**
            build/test-results/**
            androidApp/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
