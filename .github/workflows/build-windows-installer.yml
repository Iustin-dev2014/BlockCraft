name: Build BlockCraft Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src/main/resources/**'
      - 'androidApp/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'installer/**'
      - '.github/workflows/build-windows-installer.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout BlockCraft
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build standalone Windows application image
        run: gradle --no-daemon clean test packageWindows

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build full Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (!$iscc) {
            $found = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (!$iscc) { throw "Inno Setup compiler ISCC.exe could not be found after installation." }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "installer\BlockCraft.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $packages = Get-ChildItem build\installer\*.exe
          if (!$packages) { throw "No installer EXE was produced." }
          foreach ($package in $packages) {
            $sizeMB = [math]::Round($package.Length / 1MB, 1)
            Write-Host ("Installer size: {0:N1} MB" -f $sizeMB)
            if ($package.Length -lt 250MB) {
              throw "Installer is only $sizeMB MB. Release blocked: the requested minimum is 250 MB of real game assets. Do not pad the installer artificially."
            }
            Get-FileHash $package.FullName -Algorithm SHA256
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-Windows-Installer
          path: build/installer/BlockCraft-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
